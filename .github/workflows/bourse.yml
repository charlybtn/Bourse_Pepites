name: Bourse Pepites

# Lancement : un service externe (cron-job.org) déclenche ce workflow à l'heure exacte
# (8h, 10h, 12h, 14h, 16h, heure de Paris, du lundi au vendredi) via l'API GitHub.
# Lancement manuel possible à tout moment : Actions -> Bourse Pepites -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bourse
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run script
        run: python agents_bourse.py --une-fois
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
