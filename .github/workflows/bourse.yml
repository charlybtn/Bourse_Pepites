name: Votre Nom de Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permet de le lancer manuellement

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # --- AJOUTEZ CES DEUX LIGNES ICI ---
    permissions:
      contents: write
    # -----------------------------------

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Ajustez selon votre version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python bourse_agents.py --une-fois
