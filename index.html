<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pépites</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#14181f;--mut:#667085;--ok:#0a7d3c;--ko:#c42b1c;--acc:#0f766e;--line:#e4e7ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--txt:#eef1f5;--mut:#9aa4b2;--ok:#3ccf7a;--ko:#ff6b5b;--acc:#2dd4bf;--line:#262c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.resume{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.resume div,.carte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.resume b{display:block;font-size:20px}
.resume span{color:var(--mut);font-size:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:18px 0 8px}
.carte{margin-bottom:10px}
.haut{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nom{font-weight:600}
.tick{color:var(--mut);font-size:12px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.cible_atteinte{color:var(--ok);border-color:var(--ok)}
.delai_depasse{color:var(--ko);border-color:var(--ko)}
.barre{height:8px;background:var(--line);border-radius:4px;margin:10px 0 6px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--acc)}
.ligne{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.gain{font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--ko)}
.vide{color:var(--mut);text-align:center;padding:40px 0}
</style>
</head>
<body>
<main>
  <h1>Suivi des pépites</h1>
  <div class="sub" id="maj">Chargement…</div>
  <div class="resume" id="resume"></div>
  <div id="liste"></div>
</main>
<script>
const RAW = "https://raw.githubusercontent.com/charlybtn/agents-clode/main/suivi.json";
const HORIZON = 30;
const $ = s => document.querySelector(s);
const eur = n => n.toLocaleString("fr-FR", {style: "currency", currency: "EUR"});
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const LABEL = {en_cours: "En cours", cible_atteinte: "Cible atteinte", delai_depasse: "Délai dépassé"};

const DEMO = {maj: new Date().toISOString(), alertes: [
  {ticker: "GTT.PA", nom: "GTT SA", date_alerte: "2026-11-18", prix_alerte: 20, prix_cible: 23.5, quantite: 12, prix_actuel: 22.1, seances: 3, statut: "en_cours"},
  {ticker: "SW.PA", nom: "Sodexo", date_alerte: "2026-11-02", prix_alerte: 55, prix_cible: 63, quantite: 4, prix_cloture: 63, seances: 8, statut: "cible_atteinte"},
  {ticker: "UBI.PA", nom: "Ubisoft", date_alerte: "2026-09-20", prix_alerte: 12, prix_cible: 14, quantite: 20, prix_cloture: 11.2, seances: 30, statut: "delai_depasse"}
]};

async function charger() {
  if (location.search.includes("demo")) return DEMO;
  try {
    const r = await fetch(RAW + "?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok && r.status !== 404) throw new Error(r.status);
    const d = r.ok ? await r.json() : {alertes: []};
    try { localStorage.setItem("suivi", JSON.stringify(d)); } catch (e) {}
    return d;
  } catch (e) {
    let c = null;
    try { c = localStorage.getItem("suivi"); } catch (e2) {}
    if (c) { const d = JSON.parse(c); d.hors_ligne = true; return d; }
    throw e;
  }
}

function calc(a) {
  const fin = a.statut !== "en_cours";
  const px = fin ? a.prix_cloture : (a.prix_actuel ?? a.prix_alerte);
  return {fin, px, gain: (px - a.prix_alerte) * a.quantite, pct: (px / a.prix_alerte - 1) * 100,
          prog: Math.max(0, Math.min(100, (px - a.prix_alerte) / (a.prix_cible - a.prix_alerte) * 100))};
}

function carte(a) {
  const c = calc(a), cls = c.gain >= 0 ? "pos" : "neg", signe = c.gain >= 0 ? "+" : "";
  return `<div class="carte">
    <div class="haut"><div><span class="nom">${esc(a.nom)}</span> <span class="tick">${esc(a.ticker)}</span></div>
      <span class="badge ${esc(a.statut)}">${LABEL[a.statut] || esc(a.statut)}</span></div>
    <div class="barre"><i style="width:${c.prog.toFixed(0)}%"></i></div>
    <div class="ligne"><span>Achat ${eur(a.prix_alerte)}</span><span>${c.fin ? "Sortie" : "Actuel"} ${eur(c.px)}</span><span>Cible ${eur(a.prix_cible)}</span></div>
    <div class="ligne" style="margin-top:6px"><span>${a.seances ?? 0}/${HORIZON} séances · ${a.quantite} actions</span>
      <span class="gain ${cls}">${signe}${eur(c.gain)} (${signe}${c.pct.toFixed(1)} %)</span></div>
  </div>`;
}

function afficher(d) {
  const al = (d.alertes || []).slice().sort((x, y) => String(y.date_alerte).localeCompare(String(x.date_alerte)));
  const groupes = {en_cours: [], cible_atteinte: [], delai_depasse: []};
  al.forEach(a => (groupes[a.statut] || groupes.en_cours).push(a));
  const total = al.reduce((s, a) => s + calc(a).gain, 0);
  $("#resume").innerHTML = `
    <div><b>${groupes.en_cours.length}</b><span>en cours</span></div>
    <div><b class="${total >= 0 ? "pos" : "neg"}">${total >= 0 ? "+" : ""}${eur(total)}</b><span>gain estimé total (brut)</span></div>
    <div><b>${groupes.cible_atteinte.length}</b><span>cibles atteintes</span></div>
    <div><b>${groupes.delai_depasse.length}</b><span>délais dépassés</span></div>`;
  let html = "";
  [["en_cours", "En cours"], ["cible_atteinte", "Cibles atteintes"], ["delai_depasse", "Délais dépassés"]].forEach(([k, t]) => {
    if (groupes[k].length) html += `<h2>${t}</h2>` + groupes[k].map(carte).join("");
  });
  $("#liste").innerHTML = html || '<div class="vide">Aucune alerte pour l\'instant.</div>';
  const m = d.maj ? new Date(d.maj).toLocaleString("fr-FR", {dateStyle: "short", timeStyle: "short"}) : "jamais";
  $("#maj").textContent = "Mis à jour : " + m + (d.hors_ligne ? " (hors ligne)" : "") + " · cours différés";
}

charger().then(afficher).catch(() => { $("#maj").textContent = "Impossible de charger les données."; });
</script>
</body>
</html>
